<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinema Seat Manager</title>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-6 p-6">
      <div class="w-full rounded-3xl border border-slate-200 bg-white shadow-sm p-6">
        <h1 class="text-4xl font-bold tracking-tight text-slate-900">Cinema Seat Manager</h1>
        <p class="mt-3 text-slate-600">
          Haz clic en un asiento libre para reservarlo. El sistema usa un array bidimensional simple de TypeScript.
        </p>

        <div id="cinema-grid" class="mt-6 grid grid-cols-10 gap-2"></div>

        <div class="mt-6 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-slate-700">
          <p class="text-sm">
            Asientos disponibles:
            <span id="available-count" class="font-semibold text-slate-900"></span>
          </p>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
